name: Frontend Deploy

on:
    workflow_run:
        workflows:
            - Frontend CI
        types:
            - completed
        branches:
            - master

concurrency:
    group: frontend-production
    cancel-in-progress: false

jobs:
    deploy:
        name: deploy-production

        if: ${{ github.event.workflow_run.conclusion == 'success' }}

        runs-on: ubuntu-latest
        environment: production

        steps:
            - name: Deploy frontend
              uses: appleboy/ssh-action@v1.2.5
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  port: ${{ secrets.SSH_PORT }}

                  script: |
                      set -e

                      cd /root/globalOil/frontend

                      git fetch origin master
                      git switch master
                      git reset --hard origin/master

                      docker compose -f docker-compose.prod.yml up -d --build --force-recreate --remove-orphans frontend

                      docker compose -f docker-compose.prod.yml ps frontend

                      # Do not prune volumes: they may hold data from other
                      # services. This only removes stopped containers, unused
                      # images and stale build cache older than seven days.
                      retention="${DOCKER_PRUNE_UNTIL:-168h}"
                      echo "Docker usage before cleanup:"
                      docker system df || true
                      docker container prune --force --filter "until=${retention}" || true
                      docker image prune --all --force --filter "until=${retention}" || true
                      docker builder prune --all --force --filter "until=${retention}" || true
                      echo "Docker usage after cleanup:"
                      docker system df || true
