name: Frontend Deploy

on:
    workflow_run:
        workflows:
            - Frontend CI
        types:
            - completed
        branches:
            - master

concurrency:
    group: frontend-production
    cancel-in-progress: false

jobs:
    deploy:
        name: deploy-production

        if: ${{ github.event.workflow_run.conclusion == 'success' }}

        runs-on: ubuntu-latest
        environment: production

        steps:
            - name: Deploy frontend
              uses: appleboy/ssh-action@v1.2.5
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  port: ${{ secrets.SSH_PORT }}

                  script: |
                      set -e

                      cd /root/globalOil/frontend

                      git fetch origin master
                      git switch master
                      git reset --hard origin/master

                      echo "=== Construyendo imagen frontend ==="
                      docker compose -f docker-compose.prod.yml build frontend

                      echo "=== Deteniendo frontend anterior ==="
                      docker compose -f docker-compose.prod.yml stop frontend || true

                      echo "=== Eliminando contenedor frontend anterior ==="
                      docker compose -f docker-compose.prod.yml rm -f frontend || true

                      # The original container may have been created by an
                      # older Compose project name. Remove only the explicitly
                      # reserved frontend container as a safe compatibility
                      # cleanup; do not touch unrelated containers.
                      docker rm -f frontend 2>/dev/null || true

                      echo "=== Verificando puerto 3000 antes del arranque ==="
                      port_holders="$(docker ps --filter publish=3000 --format '{{.ID}} {{.Names}} {{.Ports}}')"
                      if [ -n "${port_holders}" ]; then
                        echo "El puerto 3000 sigue ocupado por un contenedor no administrado:"
                        echo "${port_holders}"
                        exit 1
                      fi

                      if sudo ss -ltnp '( sport = :3000 )' | grep -q LISTEN; then
                        echo "El puerto 3000 está ocupado por un proceso del host, no por Docker:"
                        sudo ss -ltnp '( sport = :3000 )'
                        exit 1
                      fi

                      echo "=== Levantando nuevo frontend ==="
                      docker compose -f docker-compose.prod.yml up -d --no-build --force-recreate --remove-orphans frontend

                      echo "=== Estado del frontend ==="
                      docker compose -f docker-compose.prod.yml ps frontend

                      echo "=== Últimos logs del frontend ==="
                      docker compose -f docker-compose.prod.yml logs --tail=50 frontend || true

                      # Do not prune volumes: they may hold data from other
                      # services. This only removes stopped containers, unused
                      # images and stale build cache older than seven days.
                      retention="${DOCKER_PRUNE_UNTIL:-168h}"

                      echo "=== Docker usage before cleanup ==="
                      docker system df || true

                      docker container prune --force --filter "until=${retention}" || true
                      docker image prune --all --force --filter "until=${retention}" || true
                      docker builder prune --all --force --filter "until=${retention}" || true

                      echo "=== Docker usage after cleanup ==="
                      docker system df || true
