name: Frontend Deploy

on:
    workflow_run:
        workflows:
            - Frontend CI
        types:
            - completed
        branches:
            - master

concurrency:
    group: frontend-production
    cancel-in-progress: false

jobs:
    deploy:
        name: deploy-production
        if: >-
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push'
        runs-on: ubuntu-latest
        environment: production

        steps:
            - name: Deploy frontend on this laptop
              uses: appleboy/ssh-action@v1.2.5
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  port: ${{ secrets.SSH_PORT }}
                  script: |
                      set -eu

                      cd /home/luismolina/servidor/apps/globaloil/frontend

                      echo "=== Actualizando frontend desde master ==="
                      git fetch origin master
                      git switch master
                      git pull --ff-only origin master

                      echo "=== Construyendo y levantando el frontend ==="
                      docker compose -f docker-compose.home.yml up -d --build --force-recreate frontend

                      echo "=== Estado del frontend ==="
                      docker compose -f docker-compose.home.yml ps frontend

                      echo "=== Últimos logs del frontend ==="
                      docker compose -f docker-compose.home.yml logs --tail=50 frontend || true
