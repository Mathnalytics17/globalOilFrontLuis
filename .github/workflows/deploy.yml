name: Frontend Deploy

on:
    workflow_run:
        workflows:
            - Frontend CI
        types:
            - completed
        branches:
            - master

concurrency:
    group: frontend-production
    cancel-in-progress: false

jobs:
    deploy:
        name: deploy-production

        if: ${{ github.event.workflow_run.conclusion == 'success' }}

        runs-on: ubuntu-latest
        environment: production

        steps:
            - name: Deploy frontend
              uses: appleboy/ssh-action@v1.2.5
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  port: ${{ secrets.SSH_PORT }}

                  script: |
                      set -e

                      cd /root/globalOil/frontend

                      git fetch origin master
                      git switch master
                      git reset --hard origin/master

                      echo "=== Construyendo imagen frontend ==="
                      docker compose -f docker-compose.prod.yml build frontend

                      echo "=== Deteniendo frontend anterior ==="
                      docker compose -f docker-compose.prod.yml stop frontend || true

                      echo "=== Eliminando contenedor frontend anterior ==="
                      docker compose -f docker-compose.prod.yml rm -f frontend || true

                      echo "=== Verificando puerto 3000 antes del arranque ==="
                      sudo ss -ltnp | grep :3000 || true

                      echo "=== Levantando nuevo frontend ==="
                      docker compose -f docker-compose.prod.yml up -d --no-build --remove-orphans frontend

                      echo "=== Estado del frontend ==="
                      docker compose -f docker-compose.prod.yml ps frontend

                      echo "=== Últimos logs del frontend ==="
                      docker compose -f docker-compose.prod.yml logs --tail=50 frontend || true

                      # Do not prune volumes: they may hold data from other
                      # services. This only removes stopped containers, unused
                      # images and stale build cache older than seven days.
                      retention="${DOCKER_PRUNE_UNTIL:-168h}"

                      echo "=== Docker usage before cleanup ==="
                      docker system df || true

                      docker container prune --force --filter "until=${retention}" || true
                      docker image prune --all --force --filter "until=${retention}" || true
                      docker builder prune --all --force --filter "until=${retention}" || true

                      echo "=== Docker usage after cleanup ==="
                      docker system df || true
