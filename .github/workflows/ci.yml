name: Frontend CI

on:
    pull_request:
        branches:
            - master

    push:
        branches:
            - master

jobs:
    frontend-ci:
        name: frontend-ci
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22.21.1"
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Typecheck
              run: npm run typecheck

            - name: Lint
              run: npm run lint

            - name: Build
              run: npm run build
